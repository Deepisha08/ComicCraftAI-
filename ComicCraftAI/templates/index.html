<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - AI Comic Story Creator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<main class="container">

    <section class="hero">
        <p class="eyebrow">AI COMIC STORY CREATOR</p>

        <h1>ComicCraft</h1>

        <p>
            Create your own 5-panel AI comic story.
        </p>
    </section>

    {% if error %}
    <section class="card">
        <h2>Error</h2>
        <p>{{ error }}</p>
    </section>
    {% endif %}

    <form
    class="card form-card"
    method="post"
    action="/generate"
    enctype="multipart/form-data"
>

        <label>
            Story Prompt

            <textarea
                name="story_prompt"
                required
            >A clever fox lives in a beautiful forest. One day, the fox finds a mysterious glowing object near a tree. The fox follows the magical light and discovers a hidden secret in the forest. The fox faces a small challenge and uses intelligence and courage to solve it. In the end, the forest becomes peaceful and the fox returns home happily.</textarea>
        </label>

        <label>
            Upload Your Photo

            <input
                type="file"
                name="photo"
                accept="image/*"
            >
        </label>

        <div class="grid-2">

            <label>
                Character Name

                <input
                    type="text"
                    name="character_name"
                    value="Fox"
                    required
                >
            </label>

            <label>
                Setting

                <input
                    type="text"
                    name="setting"
                    value="Enchanted Forest"
                    required
                >
            </label>

        </div>

        <div class="grid-2">

            <label>
                Tone

                <select name="tone">

                    <option value="Adventure / Fantasy" selected>
                        Adventure / Fantasy
                    </option>

                    <option value="Funny">
                        Funny
                    </option>

                    <option value="Mystery">
                        Mystery
                    </option>

                    <option value="Emotional">
                        Emotional
                    </option>

                    <option value="Action">
                        Action
                    </option>

                </select>
            </label>

            <label>
                Art Style

                <select name="art_style">

                    <option value="Anime" selected>
                        Anime
                    </option>

                    <option value="Comic Book">
                        Comic Book
                    </option>

                    <option value="Manga">
                        Manga
                    </option>

                    <option value="Cartoon">
                        Cartoon
                    </option>

                    <option value="Fantasy Illustration">
                        Fantasy Illustration
                    </option>

                </select>
            </label>

        </div>

        <button
            type="submit"
            class="button"
        >
            Generate Comic
        </button>

    </form>

</main>

</body>
</html>
