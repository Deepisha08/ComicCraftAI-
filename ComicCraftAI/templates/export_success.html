<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>ComicCraft - Export Success</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<main class="container">

    <section class="hero">

        <p class="eyebrow">
            EXPORT SUCCESSFUL
        </p>

        <h1>
            Your comic PDF is ready!
        </h1>

        <p>
            {{ filename }}
        </p>

        <a
            class="button"
            href="{{ pdf_url }}"
            target="_blank"
        >
            Open PDF
        </a>

        <br><br>

        <a href="/">
            Create Another Comic
        </a>

    </section>

</main>

</body>

</html>
